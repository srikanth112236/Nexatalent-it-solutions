    <!-- Google Analytics (GA4) / Google Tag Manager Readiness -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      // Consent-first defaults (DPDP Act 2023 & GDPR): analytics stays denied
      // until the user grants marketing consent (Privacy tab → Consent center).
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied'
      });
      gtag('config', 'G-NEXATALENT', {
        send_page_view: true
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NEXATALENT"></script>
